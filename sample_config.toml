# A bind value of 0.0.0.0 means any network this computer can access
# You can chage this to a specfic network e.g. "192.168.1.101" here
# Or to no networks e.g. this computer only "127.0.0.1"
bind = "0.0.0.0"

# Default port is 8554 but you can change it by uncommenting the following
# bind_port = 8554

# Uncomment the following and supply a path to a valid PEM
# to activate TLS encryption.
# The PEM should contain the certificate and the private key
# If TLS is activated you must connect with "rtsps://" and not "rtsp://"
# certificate = "/path/to/pem/with/cert/and/key"

# Choose if the client is required to provide a certificate signed by the server's CA.
# none|requested|required - default none
# tls_client_auth = "required"

# You can password protect the rtsp server mount points by adding users
# like the following me and someone. If you do not add [[users]]
# then anyone can connect without a password or username
# To access such a stream try using a url such as "rtsp://me:mepass@192.168.1.101/driveway"

# [[users]]
# name = "me"
# pass = "mepass"
#
# [[users]]
# name = "someone"
# pass = "someonepass"

# Uncomment to enable MQTT
#[mqtt]
# mqtt.broker_addr = "192.168.1.122"
# mqtt.port = 1883
# mqtt.credentials = ["mqtt_user", "mqtt_password"]

# Uncomment to enable the ONVIF bridge.
# Each enabled camera becomes a virtual ONVIF Profile S device served at
#     http://<host>:<bind_port>/onvif/<camera-name>/device_service
# VMS clients (Home Assistant, Frigate, BlueIris, ...) can then discover the
# camera over WS-Discovery, fetch the RTSP URL automatically, control PTZ,
# and subscribe to motion and AI events via the ONVIF Events service
# (PullPoint subscriptions). The standard topics
#     tns1:VideoSource/MotionAlarm
#     tns1:RuleEngine/MyRuleDetector/{PeopleDetect,VehicleDetect,DogCatDetect,
#                                     FaceDetect,Visitor,Package}
#     tns1:RuleEngine/FieldDetector/ObjectsInside   (smart-AI zones)
#     tns1:AudioAnalytics/Audio/DetectedSound       (baby cry)
# are published as the camera reports them, so VMS clients that record on
# motion or on a person/vehicle detection (Frigate, BlueIris, ...) work out of
# the box.
# [onvif]
# enabled = true
# bind = "0.0.0.0"
# bind_port = 8000
# discovery = true              # answer UDP multicast WS-Discovery probes
# advertise_host = "auto"       # "auto" picks the first non-loopback IPv4 NIC


[[cameras]]
name = "driveway"
username = "admin"
password = "12345678"
address = "192.168.1.187:9000"
# MQTT Discovery: https://www.home-assistant.io/integrations/mqtt/#mqtt-discovery
# mqtt.discovery.topic = "homeassistant" # Uncomment to enable
# If using discovery, _ characters are replaced with spaces in the name and title case is applied
# mqtt.discovery.features = ["floodlight"] # Uncomment if this camera has a spotlight/floodlight
# Add "ai" to features for one binary sensor per AI type (person, vehicle, pet,
# face, visitor, package, baby cry) on cameras that support AI detection.
# mqtt.enable_ai = false                 # Uncomment to stop publishing /status/ai/*

# If you use a battery camera: **Instead** of an `address` supply the uid
# as follows
# uid = "ABCD01234567890EFG"

# By default any of the users can connect (or anyone at all if no users are specfied)
# You can uncomment the following to permit only specfic users
# permitted_users = [ "me" ]

# By default "both" "mainStream" and "subStream" are connected
# If your device has user connection limits try a single stream instead.
# stream = "mainStream"

# By default neolink will use any means to connect to the camera
# from a UID
# This include relaying via reolink servers
# This variable `discovery` controls the method of UID discovery
# - Possible values
# "relay" # Any means including connecting and transmitting through reolink
# "map" # Register our local ip address with reolink and ask the camera to connect to us but don't relay data through reolink
# "remote" # Register our local ip address with reolink but only permit same network connections (useful if broadcast is not possible)
# "local" # Do not contact reolink servers at all. Rely soley on local UDP broadcast based discovery
#
# "cellular" # Cellular camera only support Relay and Map to speed up connecting to them this option will skip the local/remote
#
# discovery = "relay"

# Certain types of camera emit status messages (such as battery levels)
#
# By default we hide these status messages from the user but you can instead requst that
# they be printed to stdout using print_format
#
# Valid values are:
# - None
# - Human
# - Xml
#
# print_format = "None"

# How the camera's audio is delivered over RTSP.
#
# "all"  (the default) offers both formats below as separate audio tracks and
#        lets the client set up the one it wants. Clients that negotiate
#        (go2rtc, and so Home Assistant and Frigate) take one; clients that do
#        not subscribe to every track and receive both at once — point those
#        at "?audio=latm" (see below) or set this to a single format.
# "latm" passes AAC through untouched as MP4A-LATM (RFC 6416). No decoding
#        happens, so there is no codec latency and the audio uses the camera's
#        own bitrate rather than ~256kbps of raw samples. Understood by
#        ffmpeg, VLC, go2rtc (Home Assistant, Frigate) and Blue Iris.
# "pcm"  decodes the audio and sends raw L16 samples. Slower and much larger,
#        but understood by everything. Use this if your client cannot play
#        MP4A-LATM.
#
# A client can override this for itself by adding ?audio= to its URL:
#     rtsp://neolink:8554/driveway/mainStream?audio=pcm
# Each client gets its own pipeline, so two clients can hold different formats
# on the same camera at once.
#
# ADPCM cameras are always decoded to L16 and ignore this setting.
#
# Passthrough needs MPEG-4 AAC in ADTS framing. Where a camera cannot provide
# it, the MP4A-LATM track is dropped and only L16 is offered, with a warning
# in the log saying why.
#
# audio_format = "all"

# How much media the server side queues may hold, in milliseconds.
# This bounds how far behind live a client can drift when it stops keeping
# up. Lower drops frames sooner but stays closer to live; higher rides out
# congestion at the cost of latency. Minimum effective value is 50.
#
# buffer_duration = 3000

# Cap the RTSP output at this many frames per second. Excess video frames are
# dropped before they reach GStreamer, which cuts CPU and bandwidth. Audio is
# never throttled. Omitted (or 0) means no limit. `fps_limit` is accepted as an
# alias.
#
# Frames are dropped, not re-encoded, so this only suits consumers that tolerate
# a broken inter-frame chain (still grabs, motion snapshots, bandwidth caps).
# Dropping P-frames leaves the frames that referenced them incomplete, so a
# decoder playing the stream back will show artefacts until the next keyframe.
# Leave this unset for normal live viewing.
#
# max_fps = 5

# Per-camera ONVIF settings (only meaningful when the global [onvif] block is
# enabled). Each camera can opt out by setting `enabled = false`.
# [cameras.onvif]
# enabled = true
# uuid = "auto"   # or a fixed UUID for stable identity across restarts


[[cameras]]
name = "storage shed"
username = "admin"
password = "987654321"
address = "192.168.1.245:9000"
# If you use a battery camera: **Instead** of an `address` supply the uid
# as follows
# uid = "ABCD01234567890EFG"

# If you use an NVR that relays several camera connections you can choose which
# camera to connect to with by setting the `channel_id`
#
# By default channel_id = 0. Eg the first connected camera on the device
# **Note**: that unlike in the official client the numbering starts from 0 not 1.
# An 8 channel NVR would have channels 0 through 7
# channel_id = 0
