[package]
name = "neolink"
description = "A standards-compliant bridge to Reolink IP cameras"
version = "0.6.3-rc.3"
authors = ["George Hilliard <thirtythreeforty@gmail.com>", "Andrew King <sheepchaan@gmail.com>"]
edition = "2018"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace]
members = [
  "crates/*",
]

[dependencies]
anyhow = "1.0.104"
axum = "0.7.9"
base64 = "0.23.0"
byte-slice-cast = {version = "1.2.3", optional = true}
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.4", features = ["derive", "cargo"] }
crossbeam-channel = {version = "0.5.16", optional = true}
dirs = {version = "6.0.0", optional = true}
env_logger = "0.11.11"
fcm-push-listener = {version = "2.0.3", optional = true}
futures = "0.3.33"
gstreamer = {version = "0.23.7", optional = true}
gstreamer-app = { version = "0.23.5", features = ["v1_20"], optional = true }
gstreamer-rtsp = { version = "0.23.5", features = ["v1_20"], optional = true }
gstreamer-rtsp-server = { version = "0.23.5", features = ["v1_20"], optional = true }
heck = "0.5.0"
log = { version = "0.4.33", features = [ "release_max_level_debug" ] }
md5 = {version = "0.8.1", optional = true}
neolink_core = { path = "crates/core", version = "0.6.3-rc.3" }
once_cell = "1.21.4"
percent-encoding = "2.3.2"
quick-xml = { version = "0.36.2", features = ["serialize"] }
regex = "1.13.1"
rumqttc = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "tracing"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["full", "tracing"] }
toml = "0.8.23"
uuid = { version = "1.24.0", features = ["v4", "v5"] }
validator = {version="0.18.1", features = ["derive"] }

[dev-dependencies]
# `ServiceExt::oneshot`, so the ONVIF router can be exercised without binding a
# port. Already in the tree as an axum dependency -- this only turns on `util`.
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5.4"

[features]
default = ["gstreamer"]
gstreamer = [
  "dep:gstreamer",
  "dep:gstreamer-app",
  "dep:gstreamer-rtsp",
  "dep:gstreamer-rtsp-server",
  "dep:byte-slice-cast",
  "dep:crossbeam-channel"
]
pushnoti = [
  "dep:fcm-push-listener",
  "dep:dirs",
  "dep:md5"
]
