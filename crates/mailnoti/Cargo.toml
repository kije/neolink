[package]
name = "mailnoti"
version = "0.6.3-rc.3"
edition = "2021"
rust-version = "1.88"


[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "cargo"] }
env_logger = "0.11.11"
log = { version = "0.4.33", features = [ "release_max_level_debug" ] }
mailin-embedded = "0.8.3"
neolink_core = { path = "../core", version = "0.6.3-rc.3" }
once_cell = "1.21.4"
regex = "1.13.1"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.8.23"
validator = {version="0.18.1", features = ["derive"] }
