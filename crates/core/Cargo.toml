[package]
name = "neolink_core"
description = "Core services and structure for Reolink IP cameras"
version = "0.6.3-rc.3"
authors = ["George Hilliard <thirtythreeforty@gmail.com>", "Andrew King <sheepchaan@gmail.com>"]
edition = "2018"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[dependencies]
aes = "0.8.4"
bytes = "1.12.1"
cfb-mode = "0.8.2"
cookie-factory = "0.3.3"
crc32fast = "1.5.0"
crossbeam-channel = "0.5.16"
delegate = "0.12.0"
futures = "0.3.33"
get_if_addrs = "0.5.3"
lazy_static = "1.5.0"
log = "0.4.33"
md5 = "0.7.0"
nom = { version = "7.1.3", features = ["alloc"] }
quick-xml = { version = "0.36.2", features = ["serialize"] }
rand = "0.8.7"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "1.0.69"
time = { version = "0.3.54" , features = [ "macros", "parsing", "local-offset" ]}
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync", "time", "net"] }
tokio-util = { version = "0.7.19", features = ["full", "tracing"] }

[dev-dependencies]
assert_matches = "1.5.0"
env_logger = "0.11.11"
indoc = "2.0.7"
