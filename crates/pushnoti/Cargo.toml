[package]
name = "pushnoti"
version = "0.6.3-rc.3"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "cargo"] }
env_logger = "0.11.11"
fcm-push-listener =  { version = "2.0.3" }
log = { version = "0.4.33", features = [ "release_max_level_debug" ] }
neolink_core = { path = "../core", version = "0.6.3-rc.3" }
regex = "1.13.1"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
validator = {version="0.21.0", features = ["derive"] }
